name: surrah
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.0
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.7.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  rename: ^3.1.0
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true

  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#123C36"
  image_path: "assets/images/appLogo.png"

flutter_native_splash:
  color: "#123C36"
  image: assets/images/splashLogo.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#123C36"
    image: assets/images/splashLogo.png
  fullscreen: true
flutter_intl:
  enabled: true
